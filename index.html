<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<link rel="manifest" href="manifest.json">
<title>English Flashcard 1000</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2ff;color:#172033}
.app{max-width:560px;margin:auto;min-height:100vh;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0}.sub{font-size:13px;color:#64748b;margin-top:4px}
button,select{border:0;border-radius:12px;padding:12px 14px;font-size:15px}
select{background:white;border:1px solid #dbe2ea}
.card{background:white;border-radius:24px;min-height:330px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 8px 30px #00000012;cursor:pointer}
.label{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:18px}
.indo{font-size:28px;line-height:1.35;font-weight:700}.eng{font-size:25px;line-height:1.35;font-weight:700;color:#1d4ed8}
.meaning{font-size:14px;color:#64748b;margin-top:10px}.hint{margin-top:22px;font-size:13px;color:#94a3b8}
.hidden{display:none}.progress{height:9px;background:#dbeafe;border-radius:9px;margin:16px 0;overflow:hidden}.bar{height:100%;width:0;background:#2563eb}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.controls button{background:white}.know{background:#dcfce7!important;color:#166534}.again{background:#fee2e2!important;color:#991b1b}
.nav{display:flex;gap:10px;margin-top:12px}.nav button{flex:1;background:#172554;color:white}
.row{display:flex;gap:10px;align-items:center;margin:12px 0}.row>*{flex:1}
.stats{font-size:13px;color:#475569;text-align:center;margin:10px}
#word{font-size:15px;color:#475569;margin-top:14px;font-weight:600}
</style>
</head>
<body>
<div class="app">
<header><div><h1>English Flashcard 1000</h1><div class="sub">Indonesia → English • latihan speaking</div></div></header>
<div class="row">
<select id="cat"><option value="all">Semua kategori</option></select>
<button id="shuffle">Acak</button>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="stats" id="stats"></div>
<div class="card" id="card" role="button" aria-label="Flashcard">
  <div id="front"><div class="label">Bahasa Indonesia</div><div class="indo" id="indo"></div><div class="hint">Ketuk kartu untuk melihat bahasa Inggris</div></div>
  <div id="back" class="hidden"><div class="label">English</div><div class="eng" id="english"></div><div class="meaning" id="meaning"></div><div id="word"></div><div class="hint">Tekan 🔊 untuk mendengarkan</div></div>
</div>
<div class="controls">
<button class="again" id="again">✗ Belum hafal</button>
<button class="know" id="know">✓ Sudah hafal</button>
</div>
<div class="nav"><button id="prev">← Sebelumnya</button><button id="next">Berikutnya →</button></div>
<div class="row"><button id="speak">🔊 Dengarkan English</button><button id="reset">Reset progress</button></div>
</div>
<script src="data.js"></script>
<script>
let cards=[...CARDS], idx=0, shown=false;
const key='ef1000_progress_v1', prog=JSON.parse(localStorage.getItem(key)||'{}');
const $=id=>document.getElementById(id);
const cats=[...new Set(CARDS.map(x=>x.category))].sort();
cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c; $('cat').appendChild(o)});
function filtered(){let c=$('cat').value;return c==='all'?cards:cards.filter(x=>x.category===c)}
function render(){
 let a=filtered(); if(!a.length)return; if(idx>=a.length)idx=0;if(idx<0)idx=a.length-1;
 let x=a[idx]; shown=false;$('front').classList.remove('hidden');$('back').classList.add('hidden');
 $('indo').textContent=x.indo;$('english').textContent=x.english;$('meaning').textContent=x.meaning;$('word').textContent=x.word;
 $('stats').textContent=`Kartu ${idx+1} / ${a.length} • Hafal: ${Object.values(prog).filter(Boolean).length} / 1000`;
 $('bar').style.width=(100*Object.values(prog).filter(Boolean).length/1000)+'%';
}
function flip(){shown=!shown;$('front').classList.toggle('hidden',shown);$('back').classList.toggle('hidden',!shown)}
function move(n){idx+=n;render()}
$('card').onclick=flip;$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);
$('know').onclick=()=>{let x=filtered()[idx];prog[x.id]=true;localStorage.setItem(key,JSON.stringify(prog));move(1)};
$('again').onclick=()=>move(1);
$('shuffle').onclick=()=>{cards.sort(()=>Math.random()-.5);idx=0;render()};
$('cat').onchange=()=>{idx=0;render()};
$('speak').onclick=()=>{let x=filtered()[idx];let u=new SpeechSynthesisUtterance(x.english);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)};
$('reset').onclick=()=>{if(confirm('Hapus semua progress?')){localStorage.removeItem(key);location.reload()}};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip()} if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
