    }

      font-size: 0.85rem;

    .progress-bar-bg {

      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0.5%;
      background: linear-gradient(90deg, var(--primary), var(--accent));

      transition: width 0.3s ease;
    }

    .flashcard-container {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .flashcard {
      width: 100%;
      min-height: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card-badge {
      align-self: flex-start;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 8px;
      background-color: var(--primary-light);
      color: var(--primary);
    }

    .content-section {
      margin: 20px 0;
      text-align: center;
    }

    .label-lang {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .sentence-id {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .divider {
      height: 1px;
      background-color: var(--border);
      margin: 14px 0;
    }

    .sentence-en-box {
      min-height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .sentence-en {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-dark);
      line-height: 1.4;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .audio-btn {
      display: none;
      margin-top: 10px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      align-items: center;
      gap: 6px;
    }

    .audio-btn:active {
      background-color: var(--primary-light);
      color: var(--primary);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .placeholder-en {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .controls-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main {
      width: 100%;
      padding: 15px;

      font-weight: 700;
      border: none;
      border-radius: 14px;
      background-color: var(--primary);
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: all 0.2s ease;
    }

    .btn-main:active {
      background-color: var(--primary-dark);
      transform: scale(0.98);
    }

    .nav-buttons {

      grid-template-columns: 1fr 1.5fr;
      gap: 10px;
    }

      border-radius: 14px;
      background-color: #ffffff;
      color: var(--text-main);

    .btn-secondary:active {

      color: #ffffff;

      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 6px;

    let currentIndex = 0;
    let isTranslated = false;

    const counterEl = document.getElementById("card-counter");
    const percentEl = document.getElementById("percent-indicator");
    const progressFillEl = document.getElementById("progress-fill");
    const tagEl = document.getElementById("card-tag");
    const textIdEl = document.getElementById("text-id");
    const textEnEl = document.getElementById("text-en");
    const placeholderEl = document.getElementById("text-placeholder");
    const audioBtnEl = document.getElementById("audio-btn");
    const translateBtnEl = document.getElementById("translate-btn");
    const prevBtnEl = document.getElementById("prev-btn");

    function updateCard() {
      const current = sentences[currentIndex];
      tagEl.textContent = "Kalimat #" + current.id;
      counterEl.textContent = (currentIndex + 1);
      
      const percent = Math.round(((currentIndex + 1) / sentences.length) * 100);
      percentEl.textContent = percent + "%";
      progressFillEl.style.width = percent + "%";

      textIdEl.textContent = current.id_text;
      textEnEl.textContent = current.en_text;

      // Reset translation state
      isTranslated = false;
      textEnEl.style.display = "none";
      audioBtnEl.style.display = "none";
      placeholderEl.style.display = "block";
      translateBtnEl.style.display = "block";
      translateBtnEl.textContent = "Terjemahkan";

      prevBtnEl.disabled = currentIndex === 0;
      prevBtnEl.style.opacity = currentIndex === 0 ? "0.4" : "1";
    }

    function showTranslation() {
      if (!isTranslated) {
        isTranslated = true;
        placeholderEl.style.display = "none";
        textEnEl.style.display = "block";
        audioBtnEl.style.display = "inline-flex";
        translateBtnEl.textContent = "Sudah Diterjemahkan";
        translateBtnEl.style.backgroundColor = "#10b981";
      }
    }

    function nextCard() {
      if (currentIndex < sentences.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0; // Loop kembali ke awal
      }
      translateBtnEl.style.backgroundColor = "var(--primary)";
      updateCard();
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        translateBtnEl.style.backgroundColor = "var(--primary)";
        updateCard();
      }
    }

    function shuffleCards() {
      for (let i = sentences.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [sentences[i], sentences[j]] = [sentences[j], sentences[i]];
      }
      currentIndex = 0;
      translateBtnEl.style.backgroundColor = "var(--primary)";
      updateCard();
    }

    function playAudio() {
      if ("speechSynthesis" in window) {
        const utterance = new SpeechSynthesisUtterance(sentences[currentIndex].en_text);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Dukungan navigasi keyboard (desktop/laptop)
    document.addEventListener("keydown", function(e) {
      if (e.code === "Space") {
        e.preventDefault();
        showTranslation();
      } else if (e.code === "ArrowRight") {
        nextCard();
      } else if (e.code === "ArrowLeft") {
        prevCard();
      }
    });

    // Swipe gesture support on smartphone
    let touchstartX = 0;
    let touchendX = 0;
    const cardEl = document.getElementById("card");

    cardEl.addEventListener("touchstart", function(e) {
      touchstartX = e.changedTouches[0].screenX;
    }, false);

    cardEl.addEventListener("touchend", function(e) {
      touchendX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      if (touchendX < touchstartX - 50) {
        nextCard(); // Geser ke kiri untuk Next
      }
      if (touchendX > touchstartX + 50) {
        prevCard(); // Geser ke kanan untuk Prev
      }
    }

    // Inisialisasi awal
    updateCard();
  </script>
